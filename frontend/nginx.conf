server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for hashed, content-addressed build assets
    location ~* ^/assets/.*\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|webp|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Known client-side routes serve the SPA shell
    location = / { try_files /index.html =404; }
    location = /about { try_files /index.html =404; }
    location = /contact { try_files /index.html =404; }
    location = /privacy-policy { try_files /index.html =404; }

    # Plain static files (robots.txt, sitemap.xml, ads.txt, ...) and a real 404
    # for everything else — no silent SPA fallback for unknown paths.
    location / {
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Backend API
    location /api/ {
        proxy_pass http://boostseo-backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
